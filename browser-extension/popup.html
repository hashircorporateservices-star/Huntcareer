<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { width: 320px; font: 13px/1.4 -apple-system, system-ui, sans-serif; margin: 0; color: #1c1917; }
  header { padding: 14px 16px; background: #1f6344; color: #fff; font-weight: 600; }
  .body { padding: 14px 16px; }
  button { width: 100%; padding: 9px; border: 0; border-radius: 8px; background: #1f6344; color: #fff; font-weight: 500; cursor: pointer; }
  button.secondary { background: #f5f5f4; color: #1c1917; margin-top: 8px; }
  .status { margin-top: 10px; font-size: 12px; color: #78716c; }
  .item { border: 1px solid #e7e5e4; border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
  .item b { display: block; font-size: 12px; }
  .muted { color: #78716c; font-size: 11px; }
</style>
</head>
<body>
  <header>HuntCareer Autofill</header>
  <div class="body">
    <button id="fill">Fill this application from my profile</button>
    <button id="open-review" class="secondary">Open review queue</button>
    <div class="status" id="status">You review every field and submit yourself.</div>
    <div id="queue"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
